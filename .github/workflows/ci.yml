name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.3'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check data-pipeline
        if: hashFiles('data-pipeline/**/*.py') != ''
      - run: uv run --locked ruff format --check data-pipeline
        if: hashFiles('data-pipeline/**/*.py') != ''
      - run: uv run --locked python -m unittest discover -s data-pipeline -p "test_*.py"
        if: hashFiles('data-pipeline/**/*.py') != ''
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: site-${{ github.sha }}
          path: dist
          retention-days: 7
